name: visual-diffs

on:
  workflow_call:
    secrets:
      upload-token:
        required: true
    inputs:
      container:
        description: Playwright container image; must match the repo's Playwright version
        required: true
        type: string
      install-command:
        description: Installs the repo's dependencies (inline any env vars it needs)
        required: false
        type: string
        default: npm ci
      test-command:
        description: Playwright command WITHOUT --update-snapshots/--retries; run twice (compare, then capture)
        required: false
        type: string
        default: npx playwright test --grep @visual
      screenshots-dir:
        description: Directory of committed baselines, relative to the repo root
        required: false
        type: string
        default: e2e/__screenshots__
      pad:
        description: Rows of context to keep around each changed band
        required: false
        type: string
        default: "40"
      working-directory:
        description: Directory holding playwright's test-results/ (monorepos, e.g. apps/web)
        required: false
        type: string
        default: "."
      postgres-image:
        description: "Postgres service image (e.g. postgres:17) for apps whose e2e needs a database; empty = no service. Trust auth, user postgres, reachable at host `postgres`"
        required: false
        type: string
        default: ""

jobs:
  visual:
    name: Visual diffs
    if: >-
      github.actor != 'github-actions[bot]' && github.actor != 'dependabot[bot]' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.user.login != 'dependabot[bot]'))
    runs-on: ubuntu-latest
    container: ${{ inputs.container }}
    timeout-minutes: 15
    concurrency:
      group: visual-diffs-${{ github.repository }}-${{ github.event.pull_request.number || github.ref_name }}
      cancel-in-progress: true
    permissions:
      contents: write
      pull-requests: write
    services:
      postgres:
        image: ${{ inputs.postgres-image }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
    env:
      HUSKY: 0

    steps:
      # The tools come from the same commit as this workflow, so the pin can't drift.
      - name: Resolve this workflow's commit
        env:
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          if [ -z "$WORKFLOW_REPOSITORY" ] || [ -z "$WORKFLOW_SHA" ]; then
            echo "::error::job.workflow_repository or job.workflow_sha is empty; cannot fetch matching tools."
            exit 1
          fi
          echo "Tools: $WORKFLOW_REPOSITORY@$WORKFLOW_SHA"

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      # Checkout inside a container leaves the workspace owned by another uid.
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install dependencies
        run: ${{ inputs.install-command }}

      - name: Fetch image tools
        uses: actions/checkout@v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .visual-diffs-action
          persist-credentials: false

      - name: Install image tools
        run: npm --prefix .visual-diffs-action ci --ignore-scripts --no-audit --no-fund

      - name: Fetch target branch's baselines
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.base_ref }}
          path: .visual-target
          sparse-checkout: ${{ inputs.screenshots-dir }}
          persist-credentials: false

      - name: Use target branch's baselines for the comparison
        if: github.event_name == 'pull_request'
        id: baseline
        env:
          SCREENSHOTS_DIR: ${{ inputs.screenshots-dir }}
        run: node .visual-diffs-action/baseline.mjs "$SCREENSHOTS_DIR" ".visual-target/$SCREENSHOTS_DIR"

      # Mismatches are expected here, never fatal. --retries 0 keeps retried
      # failures from duplicating crops.
      - name: Compare against target branch
        if: steps.baseline.outputs.ready == 'true'
        id: compare
        continue-on-error: true
        run: ${{ inputs.test-command }} --retries 0

      - name: Crop visual changes
        if: steps.baseline.outputs.ready == 'true'
        working-directory: ${{ inputs.working-directory }}
        run: node "$GITHUB_WORKSPACE/.visual-diffs-action/crop-diffs.mjs" --pad "${{ inputs.pad }}"

      # This pass must succeed: broken pages never publish evidence or baselines.
      - name: Capture this branch's screenshots
        run: ${{ inputs.test-command }} --update-snapshots

      - name: Update PR description
        if: steps.baseline.outputs.ready == 'true'
        uses: ./.visual-diffs-action
        with:
          images: ${{ inputs.working-directory }}/visual-diffs
          token: ${{ secrets.upload-token }}
          allow-empty: 'true'
          clear: ${{ steps.compare.outcome == 'success' }}

      - name: Commit updated screenshots
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          branch: ${{ github.head_ref || github.ref_name }}
          commit_message: "chore(visual): update screenshots"
          file_pattern: ${{ inputs.screenshots-dir }}/**
