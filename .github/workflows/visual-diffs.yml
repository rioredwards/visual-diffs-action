name: visual-diffs

on:
  workflow_call:
    secrets:
      upload-token:
        required: true
    inputs:
      container:
        description: Playwright container image — must match the repo's Playwright version
        required: true
        type: string
      install-command:
        description: Installs the repo's dependencies (inline any env vars it needs)
        required: false
        type: string
        default: npm ci
      test-command:
        description: Playwright command WITHOUT --update-snapshots/--retries; run twice (compare, then update)
        required: false
        type: string
        default: npx playwright test --grep @visual
      screenshots-path:
        description: Glob of committed baselines to commit back to the PR branch
        required: false
        type: string
        default: e2e/__screenshots__/**
      pad:
        description: Rows of context to keep around each changed band
        required: false
        type: string
        default: "40"
      working-directory:
        description: Directory holding playwright's test-results/ (monorepos — e.g. apps/web)
        required: false
        type: string
        default: "."
      postgres-image:
        description: "Postgres service image (e.g. postgres:17) for apps whose e2e needs a database; empty = no service. Trust auth, user postgres, reachable at host `postgres`"
        required: false
        type: string
        default: ""
      action-ref:
        description: "Exact commit of visual-diffs-action, matching the caller workflow pin"
        required: true
        type: string

jobs:
  visual:
    name: Visual snapshots → PR branch
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    container: ${{ inputs.container }}
    concurrency:
      group: visual-diffs-${{ github.repository }}-${{ github.event.number }}
      cancel-in-progress: true
    permissions:
      contents: write
      pull-requests: write
    services:
      postgres:
        image: ${{ inputs.postgres-image }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
    env:
      HUSKY: 0

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      # Checkout inside a container leaves the workspace owned by another uid.
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install dependencies
        run: ${{ inputs.install-command }}

      - name: Fetch crop tool
        uses: actions/checkout@v4
        with:
          repository: rioredwards/visual-diffs-action
          ref: ${{ inputs.action-ref }}
          path: .visual-diffs-action

      - name: Install crop tool
        run: npm --prefix .visual-diffs-action ci --no-audit --no-fund

      # Pass 1 compares against the committed baselines so Playwright writes
      # *-diff.png for changed routes. Mismatches are expected, never fatal.
      # --retries 0 keeps retried failures from duplicating crops.
      - name: Compare against baselines
        run: ${{ inputs.test-command }} --retries 0 || true

      - name: Crop visual changes
        working-directory: ${{ inputs.working-directory }}
        run: node "$GITHUB_WORKSPACE/.visual-diffs-action/crop-diffs.mjs" --pad "${{ inputs.pad }}"

      - name: Update baselines
        run: ${{ inputs.test-command }} --update-snapshots

      - name: Attach changed regions to PR description
        uses: ./.visual-diffs-action
        with:
          images: ${{ inputs.working-directory }}/visual-diffs
          token: ${{ secrets.upload-token }}
          allow-empty: 'true'

      - name: Commit updated screenshots
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          branch: ${{ github.head_ref }}
          commit_message: "chore(visual): update screenshots"
          file_pattern: ${{ inputs.screenshots-path }}

