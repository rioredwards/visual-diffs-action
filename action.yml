name: PR visual evidence
description: Upload captured images into a managed PR description section using gh --attach.
inputs:
  images:
    description: Directory containing PNG, JPEG, GIF or WebP images (searched recursively).
    required: true
  allow-empty:
    description: Leave the PR unchanged when comparison found no changed images.
    default: 'false'
  token:
    description: User token with repository write access and pull request write permission; GITHUB_TOKEN cannot upload media.
    required: true
runs:
  using: composite
  steps:
    - name: Install GitHub CLI 2.100.0
      shell: bash
      run: |
        set -euo pipefail
        test "$(uname -sm)" = "Linux x86_64" || { echo "Requires a Linux x64 runner"; exit 1; }
        dest=$(mktemp -d "$RUNNER_TEMP/pr-images-gh.XXXXXX")
        curl --fail --silent --show-error --location https://github.com/cli/cli/releases/download/v2.100.0/gh_2.100.0_linux_amd64.tar.gz -o "$dest/gh.tar.gz"
        echo "e4d4bb4498e8d007abe545b6568926793ace1b6447da598294a610018cb164be  $dest/gh.tar.gz" | sha256sum --check --strict
        tar -xzf "$dest/gh.tar.gz" -C "$dest"
        echo "$dest/gh_2.100.0_linux_amd64/bin" >> "$GITHUB_PATH"
    - name: Attach images to PR description
      shell: bash
      env:
        ALLOW_EMPTY: ${{ inputs.allow-empty }}
        GH_TOKEN: ${{ inputs.token }}
        IMAGES_PATH: ${{ inputs.images }}
        UPLOAD_SCRIPT: ${{ github.action_path }}/upload.mjs
      run: node "$UPLOAD_SCRIPT"
